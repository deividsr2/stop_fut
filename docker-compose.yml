services:
  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-emulator
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      - HOME=/home/emulator
    volumes:
      - ${USERPROFILE}/.aws/emulator:/home/emulator/.aws/emulator
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
